<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <meta name="description" content="Manage your VOLT account details.">
  <title>My Account — VOLT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/supabase-config.js"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/catalog.js"></script>
  <script defer src="assets/js/store.js"></script>
  <script defer src="assets/js/site.js"></script>
  <script defer src="assets/js/account.js"></script>
</head>
<body data-page="account">
  <div id="site-header"></div>
  <main class="wrap page-main account-page">
    <div class="page-title-row"><div><p class="eyebrow">YOUR VOLT ACCOUNT</p><h1>MY PROFILE<span class="red-dot">.</span></h1></div><button class="button button-outline" id="sign-out" type="button">SIGN OUT <span>↗</span></button></div>
    <section class="account-layout">
      <div class="account-summary"><p class="eyebrow">ACCOUNT DETAILS</p><h2 id="account-name">LOADING...</h2><p id="account-email" class="account-email"></p><p id="account-verification" class="account-note"></p></div>
      <form class="contact-form account-form" id="profile-form">
        <h2 class="auth-form-heading">EDIT YOUR PROFILE</h2>
        <label for="profile-name">YOUR NAME</label>
        <input id="profile-name" name="full_name" required maxlength="80" autocomplete="name" placeholder="FULL NAME">
        <label for="profile-phone">PHONE NUMBER</label>
        <input id="profile-phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="PHONE NUMBER (OPTIONAL)">
        <button class="button button-red" type="submit">SAVE PROFILE <span>↗</span></button>
        <p class="form-note" id="profile-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
