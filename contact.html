<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080909"><meta name="description" content="Get in touch with VOLT.">
  <title>Contact — VOLT Performance Wear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="assets/js/supabase-config.js"></script><script defer src="assets/js/supabase-client.js"></script><script defer src="assets/js/catalog.js"></script><script defer src="assets/js/store.js"></script><script defer src="assets/js/site.js"></script><script defer src="assets/js/contact.js"></script>
</head>
<body data-page="contact"><div id="site-header"></div><main class="wrap page-main contact-page">
  <div class="page-title-row"><div><p class="eyebrow">WE'RE HERE TO HELP</p><h1>CONTACT<span class="red-dot">.</span></h1></div><p class="page-title-note">LET'S TALK GEAR.</p></div>
  <div class="contact-layout"><section class="contact-info"><h2>GOT A QUESTION?<br>WE'VE GOT YOU.</h2><p>Questions about fit, your order, or just want to say what's up? Drop us a message.</p><div class="contact-detail"><span>EMAIL</span><a href="mailto:hello@volt.example">HELLO@VOLT.EXAMPLE</a></div><div class="contact-detail"><span>INSTAGRAM</span><a href="https://instagram.com/" target="_blank" rel="noreferrer">@VOLT.TRAINING ↗</a></div><p class="contact-note">Demo site: this form does not send or store messages.</p></section>
    <form class="contact-form" id="contact-form"><label for="contact-name">YOUR NAME</label><input id="contact-name" name="name" required autocomplete="name" placeholder="NAME"><label for="contact-email">EMAIL ADDRESS</label><input id="contact-email" name="email" type="email" required autocomplete="email" placeholder="EMAIL"><label for="contact-topic">WHAT'S THIS ABOUT?</label><select id="contact-topic" name="topic"><option>Product question</option><option>Order question</option><option>Something else</option></select><label for="contact-message">MESSAGE</label><textarea id="contact-message" name="message" rows="5" required placeholder="TELL US WHAT'S UP"></textarea><button class="button button-red" type="submit">SEND MESSAGE <span>↗</span></button><p class="form-note" id="contact-status" role="status"></p></form>
  </div>
</main><div id="site-footer"></div></body>
</html>
